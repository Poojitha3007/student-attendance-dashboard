apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-demo
  template:
    metadata:
      labels:
        app: attendance-demo
    spec:
      containers:
      - name: attendance-demo
        image: kurellapoojitha/student-attendance-dashboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-demo-service
spec:
  type: NodePort
  selector:
    app: attendance-demo
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30011
